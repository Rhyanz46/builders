name: Release

# Every push to main is what Netlify deploys, so each one gets a GitHub
# release, versioned with semver from the labels of the pull requests it
# brings since the last release:
#
#   - any PR labelled `breaking`     -> major  (v1.4.2 -> v2.0.0)
#   - else any labelled `enhancement` -> minor (v1.4.2 -> v1.5.0)
#   - else                            -> patch (v1.4.2 -> v1.4.3)
#
# The first release, with no tag before it, is v1.0.0. The notes list those
# pull requests, grouped by label as .github/release.yml says.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish a release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every PR merged since the last release, into develop or main.
          since=$(git log -1 --format=%cI "$last")
          labels=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 500 \
            --search "merged:>$since" --json labels --jq '[.[].labels[].name] | unique | join(" ")')
          echo "Labels since $last: ${labels:-none}"

          IFS=. read -r major minor patch <<< "${last#v}"
          case " $labels " in
            *" breaking "*)    major=$((major + 1)); minor=0; patch=0 ;;
            *" enhancement "*) minor=$((minor + 1)); patch=0 ;;
            *)                 patch=$((patch + 1)) ;;
          esac
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
